name: Uptime Kuma monitoring tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Deploy and test the full stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check toolchain
        run: |
          docker version
          docker compose version
          python3 --version

      - name: Validate shell scripts
        run: |
          shellcheck -S error scripts/*.sh tests/*.sh

      - name: Validate Compose files
        run: |
          docker compose --env-file .env.example -f compose/app.yml config -q
          docker compose --env-file .env.example -f compose/monitoring.yml config -q

      - name: Validate JSON and YAML configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path("grafana").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"Valid JSON: {path}")
          PY
          docker run --rm --entrypoint /bin/promtool -v "$PWD/prometheus:/etc/prometheus:ro" prom/prometheus:v3.8.1 check config /etc/prometheus/prometheus.yml
          set +e
          timeout 5s docker run --rm -v "$PWD/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro" prom/blackbox-exporter:v0.27.0 --config.file=/etc/blackbox_exporter/config.yml >/tmp/blackbox-config.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat /tmp/blackbox-config.log
            echo "Blackbox Exporter config validation failed (exit code: $status)"
            exit 1
          fi

      - name: Create isolated test credentials
        run: |
          {
            echo "MARIADB_DATABASE=uptime_kuma"
            echo "MARIADB_USER=uptime_kuma"
            echo "MARIADB_PASSWORD=$(openssl rand -hex 24)"
            echo "MARIADB_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "MYSQL_EXPORTER_PASSWORD=$(openssl rand -hex 24)"
            echo "GRAFANA_ADMIN_USER=admin"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "TZ=UTC"
          } > .env

      - name: Create observability network
        run: docker network create kuma-observability

      - name: Deploy application and monitoring stack
        run: |
          docker compose --env-file .env -f compose/app.yml up -d --wait --wait-timeout 240
          docker compose --env-file .env -f compose/monitoring.yml up -d --wait --wait-timeout 240

      - name: Configure Grafana through its API
        run: |
          docker run --rm --network kuma-observability \
            -v "$PWD:/workspace:ro" -w /workspace alpine:3.21 sh -ec '
              apk add --no-cache curl python3
              sh scripts/configure-grafana.sh
            '

      - name: Run integration tests
        run: sh tests/integration.sh

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env -f compose/app.yml ps || true
          docker compose --env-file .env -f compose/monitoring.yml ps || true
          docker compose --env-file .env -f compose/app.yml logs --no-color --tail=150 || true
          docker compose --env-file .env -f compose/monitoring.yml logs --no-color --tail=150 || true

      - name: Cleanup test stack
        if: always()
        run: |
          docker compose --env-file .env -f compose/monitoring.yml down -v --remove-orphans || true
          docker compose --env-file .env -f compose/app.yml down -v --remove-orphans || true
          docker network rm kuma-observability || true
